version: "3.8"

services:
  # PostgreSQL for postgres job store
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=airunner
      - POSTGRES_PASSWORD=${COMPOSE_POSTGRES_PASSWORD}
      - POSTGRES_DB=airunner_dev
    volumes:
      - "postgres-data:/var/lib/postgresql/18/docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airunner -d airunner_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
